name: saidas-hospitalares
owner_org: fundacao-hospitalar-do-estado-de-minas-gerais-fhemig
profile: data-package
resources:
  - path: data/saidas.csv
    name: saidas
    profile: tabular-data-resource
    scheme: file
    format: csv
    hashing: md5
    encoding: utf-8-sig
    dialect:
      delimiter: ;
    schema:
      fields:
        - name: unidade
          type: string
        - name: ano
          type: string
        - name: mes
          type: geopoint
        - name: setor_centro_custo
          type: string
        - name: saidas
          type: geopoint
    title: Saídas Hospitalares
    description: Saídas Hospitalares
title: Saídas Hospitalares
